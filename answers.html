<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answers</title>
  <style>
    /* Layout only: the answers float over the whole window. */
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      text-align: center;
    }

    /* Each answer is moved around with a transform from its top-left corner. */
    .answer {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      max-width: min(300px, 80vw);
      overflow-wrap: break-word;
    }

    #empty {
      text-align: center;
    }

    #clear {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>Answers</h1>
  <p id="empty" hidden>No answers yet.</p>

  <button id="clear" type="button">clear all answers</button>
  <br>
  <button type="button" id="start">start</button>
  <div id="container">
    <video></video>
  </div>
  <script src="storage.js"></script>
  <script src="answers.js"></script>
  <script src="camera.js"></script>
</body>
</html>
